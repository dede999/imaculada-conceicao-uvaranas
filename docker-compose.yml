# Parish website on a VPS (e.g. Hetzner).
#
# First-time setup on the server:
#   1. Install Docker Engine + Compose plugin
#   2. Clone this repo (or only copy compose + Caddyfile) to e.g. /opt/paroquia
#   3. Copy .env.example → .env and fill values (DOMAIN, Supabase, PARISH_ID)
#   4. docker compose pull && docker compose up -d
#
# CI (GitHub Actions) builds the image, pushes to GHCR, then SSHs here to pull/up.

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/dede999/imaculada-conceicao-uvaranas:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_KEY: ${SUPABASE_KEY}
        PARISH_ID: ${PARISH_ID}
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      NITRO_PRESET: node-server
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
