project_id = "bpajcdrojekhctwlagcz"

[auth]
enabled = true
# Update both URLs to the production domain after deploy
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.invite]
subject = "Convite de acesso ao painel — Paróquia Imaculada Conceição"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Link de acesso ao painel — Paróquia Imaculada Conceição"
content_path = "./supabase/templates/magic_link.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
